<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NOME_UNIDADE}} — Manual do hóspede</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --ouro: #c2a14e;
  --ouro-esc: #a8873a;
  --ouro-claro: #f5f0e8;
  --petroleo: #264653;
  --texto: #2a2a2a;
  --texto-fraco: #5c5c5c;
  --texto-mudo: #9a958c;
  --fundo: #ffffff;
  --creme: #f9f8f5;
  --borda: #e2ddd2;
  --fonte: 'Montserrat', system-ui, -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  font-family: var(--fonte);
  color: var(--texto);
  background: var(--creme);
  font-size: 15px;
  line-height: 1.6;
}
.doc {
  max-width: 820px;
  margin: 0 auto;
  background: var(--fundo);
  padding: 0 0 60px;
}
img { max-width: 100%; display: block; }
a { color: var(--ouro-esc); }

/* ─── CAPA ─── */
.capa {
  background: var(--petroleo);
  color: #fff;
  padding: 64px 48px 48px;
  position: relative;
  overflow: hidden;
}
.capa::after {
  content: ''; position: absolute; top: -80px; right: -80px;
  width: 260px; height: 260px; border-radius: 50%;
  background: rgba(194,161,78,0.10);
}
.capa-tag {
  font-size: 11px; letter-spacing: 4px; text-transform: uppercase;
  color: var(--ouro); font-weight: 600; margin-bottom: 20px; position: relative;
}
.capa-titulo {
  font-size: 40px; font-weight: 800; letter-spacing: -1.2px;
  line-height: 1.1; margin-bottom: 10px; position: relative;
}
.capa-sub { font-size: 16px; color: rgba(255,255,255,0.62); font-weight: 300; position: relative; }
.capa-codigo {
  display: inline-block; margin-top: 22px; padding: 5px 13px;
  border: 1px solid rgba(194,161,78,0.5); border-radius: 4px;
  font-size: 12px; letter-spacing: 2px; color: var(--ouro); font-weight: 600; position: relative;
}
.capa-marca { margin-top: 44px; position: relative; }
.capa-marca-nome { font-size: 15px; font-weight: 600; letter-spacing: 1px; }
.capa-marca-sub { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: var(--ouro); margin-top: 4px; }

/* ─── SEÇÃO ─── */
.sec { padding: 38px 48px; border-bottom: 1px solid var(--borda); }
.sec:last-child { border-bottom: none; }
.sec-h {
  font-size: 23px; font-weight: 800; letter-spacing: -0.5px;
  margin-bottom: 22px; display: flex; align-items: baseline; gap: 12px;
}
.sec-n { font-size: 12px; font-weight: 700; color: var(--ouro); letter-spacing: 2px; }
.sub-h { font-size: 16px; font-weight: 700; margin: 26px 0 12px; }

/* ─── DESTAQUE CHECK-IN / CHECK-OUT ─── */
.destaque-duplo { display: flex; gap: 14px; margin-bottom: 22px; }
.destaque {
  flex: 1; background: var(--petroleo); color: #fff;
  border-radius: 6px; padding: 18px 22px;
}
.destaque-l { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--ouro); font-weight: 600; }
.destaque-v { font-size: 20px; font-weight: 700; margin-top: 5px; }

/* ─── TABELA ─── */
.tab { width: 100%; border-collapse: collapse; }
.tab th, .tab td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--borda); vertical-align: top; }
.tab th { width: 38%; font-weight: 600; color: var(--texto-fraco); font-size: 13px; background: var(--creme); }
.tab td { font-weight: 500; }
.tab tr:last-child th, .tab tr:last-child td { border-bottom: none; }

/* ─── COMO CHEGAR ─── */
.mapa-linha { display: flex; gap: 28px; align-items: flex-start; }
.mapa-txt { flex: 1; }
.end { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.ref { font-size: 14px; color: var(--texto-fraco); margin-bottom: 16px; }
.qr { display: block; width: 130px; text-align: center; flex-shrink: 0; text-decoration: none; color: inherit; }
.qr svg, .qr img { width: 130px; height: 130px; border: 1px solid var(--borda); border-radius: 4px; }
.qr-cap { font-size: 11px; color: var(--texto-mudo); margin-top: 7px; letter-spacing: 1px; text-transform: uppercase; }

/* ─── PASSOS DO CHECK-IN ─── */
.passos { list-style: none; counter-reset: p; }
.passos li {
  counter-increment: p; position: relative;
  padding: 0 0 18px 44px; font-size: 15px; line-height: 1.55;
}
.passos li::before {
  content: counter(p); position: absolute; left: 0; top: 0;
  width: 28px; height: 28px; border-radius: 50%;
  background: var(--ouro); color: #fff;
  font-size: 13px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.passos li:last-child { padding-bottom: 0; }

.senha {
  margin-top: 18px; background: var(--ouro-claro);
  border: 1px dashed var(--ouro); border-radius: 6px;
  padding: 14px 20px; display: flex; align-items: center; gap: 16px;
}
.senha-l { font-size: 11px; letter-spacing: 2px; text-transform: uppercase; color: var(--ouro-esc); font-weight: 600; }
.senha-v { font-size: 24px; font-weight: 800; letter-spacing: 3px; font-variant-numeric: tabular-nums; }

.aviso {
  margin-top: 18px; background: var(--creme);
  border-left: 3px solid var(--ouro); border-radius: 0 6px 6px 0;
  padding: 14px 18px; font-size: 14px; color: var(--texto-fraco); line-height: 1.55;
}

/* ─── GALERIA ─── */
.galeria { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.foto { border-radius: 6px; overflow: hidden; background: var(--creme); }
.foto-larga { grid-column: 1 / -1; }
.foto img { width: 100%; height: 190px; object-fit: cover; }
.foto-larga img { height: 280px; }
.foto figcaption { font-size: 12px; color: var(--texto-mudo); padding: 7px 10px; }

/* ─── O QUE TEM / LEVAR ─── */
.col2 { display: grid; grid-template-columns: 1.35fr 1fr; gap: 28px; }
.col-h { font-size: 15px; font-weight: 700; margin-bottom: 14px; padding-bottom: 7px; border-bottom: 2px solid var(--ouro); }
.grupo { margin-bottom: 18px; }
.grupo h4 { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--texto-mudo); font-weight: 600; margin-bottom: 7px; }
.col-levar { background: var(--creme); border-radius: 6px; padding: 20px; }
.col-levar .col-h { border-bottom-color: var(--texto-mudo); }

.lista, .lista-check, .lista-levar { list-style: none; }
.lista li { padding: 5px 0 5px 18px; position: relative; font-size: 14.5px; line-height: 1.55; }
.lista li::before { content: '·'; position: absolute; left: 4px; color: var(--ouro); font-weight: 800; }
.lista-check li { padding: 4px 0 4px 22px; position: relative; font-size: 14px; }
.lista-check li::before { content: '✓'; position: absolute; left: 0; color: var(--ouro); font-weight: 700; font-size: 13px; }
.lista-levar li { padding: 5px 0 5px 22px; position: relative; font-size: 14px; }
.lista-levar li::before { content: '+'; position: absolute; left: 2px; color: var(--texto-mudo); font-weight: 700; }

/* ─── WI-FI ─── */
.wifi { display: flex; gap: 14px; margin-bottom: 18px; }
.wifi-item { flex: 1; background: var(--ouro-claro); border-radius: 6px; padding: 18px 22px; }
.wifi-l { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--ouro-esc); font-weight: 600; }
.wifi-v { font-size: 21px; font-weight: 700; margin-top: 5px; word-break: break-all; }

/* ─── LUGARES (mercado / comida / passeio) ─── */
.lugares { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.lugar { border: 1px solid var(--borda); border-radius: 6px; padding: 14px 16px; }
.lugar-topo { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 4px; }
.lugar-nome { font-size: 15px; font-weight: 700; }
.lugar-dist { font-size: 11px; font-weight: 700; color: var(--ouro-esc); white-space: nowrap; }
.lugar-desc { font-size: 13px; color: var(--texto-fraco); line-height: 1.5; }
.grupo-lugares { margin-bottom: 22px; }
.grupo-lugares > h3 { font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--texto-mudo); font-weight: 600; margin-bottom: 10px; }

/* ─── FECHO ─── */
.fecho { margin-top: 32px; text-align: center; padding: 30px 20px; background: var(--creme); border-radius: 6px; }
.fecho-t { font-size: 25px; font-weight: 800; letter-spacing: -0.5px; }
.fecho-s { font-size: 14px; color: var(--texto-fraco); margin-top: 10px; line-height: 1.6; }

/* ─── PLACEHOLDER (dado pendente) ─── */
.ph {
  color: var(--ouro-esc); background: rgba(194,161,78,0.14);
  border: 1px dashed var(--ouro); border-radius: 4px;
  padding: 0 .3em; font-weight: 600;
}

/* ─── RODAPÉ (só na impressão) ─── */
.rodape-print { display: none; }

/* ─── MOBILE ─── */
@media (max-width: 640px) {
  body { font-size: 14.5px; }
  .capa { padding: 44px 24px 34px; }
  .capa-titulo { font-size: 30px; }
  .sec { padding: 30px 24px; }
  .sec-h { font-size: 20px; }
  .destaque-duplo, .wifi, .mapa-linha { flex-direction: column; }
  .col2, .galeria, .lugares { grid-template-columns: 1fr; }
  .qr { width: 100%; }
  .foto img, .foto-larga img { height: 210px; }
}

/* ─── IMPRESSÃO / PDF A4 ─── */
@media print {
  @page { size: A4 portrait; margin: 14mm 14mm 18mm; }
  html, body { background: #fff; font-size: 10.5pt; }
  .doc { max-width: none; padding: 0; }

  /* a capa ocupa a primeira página inteira */
  .capa { padding: 30mm 12mm; break-after: page; }
  .capa::after { display: none; }
  .capa-titulo { font-size: 30pt; }

  .sec { padding: 0 0 9mm; border-bottom: none; break-inside: auto; }
  .sec-h { font-size: 15pt; margin-bottom: 5mm; break-after: avoid; }
  .quebra-antes { break-before: page; }

  /* nada pode partir ao meio */
  .destaque, .senha, .aviso, .wifi-item, .lugar, .foto, .grupo,
  .passos li, .tab tr, .col-levar, .fecho, .grupo-lugares {
    break-inside: avoid;
  }
  .tab { break-inside: auto; }

  /* secao curta que nao pode partir (lazer, regras, check-out) */
  .junto, .junto .tab { break-inside: avoid; }

  .foto img { height: 42mm; }
  .foto-larga img { height: 62mm; }

  /* rodapé repetido em toda página */
  .rodape-print {
    display: block; position: fixed; bottom: 0; left: 0; right: 0;
    font-size: 7.5pt; color: #9a958c; text-align: center;
    padding-top: 3mm; border-top: 1px solid #e2ddd2;
  }
  a { color: inherit; text-decoration: none; }
  a[href^="https://wa.me"]::after { content: ''; }
}
</style>
</head>
<body>

<div class="doc">
  <!-- {{CAPA}} -->
  <!-- {{SECOES}} -->
</div>

<div class="rodape-print">
  {{NOME_UNIDADE}} · {{CODIGO}} · Plantão Artezian {{WHATSAPP_FMT}} · artezian.com.br

</body>
</html>
