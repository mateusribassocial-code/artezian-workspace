name: Deploy Painel Artezian → Hostinger

on:
  push:
    branches: [main]
    paths:
      - "Administrativo/dashboard/**"
      - ".github/workflows/deploy-dashboard.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Marcar reinicio do app Node
        # O LiteSpeed reinicia a aplicacao quando tmp/restart.txt muda. Sem
        # isso o FTP troca os arquivos e o processo antigo continua servindo
        # da memoria o codigo do ultimo boot.
        run: |
          mkdir -p Administrativo/dashboard/tmp
          {
            echo "reinicio: $(date -u +%FT%TZ)"
            echo "commit:   $GITHUB_SHA"
          } > Administrativo/dashboard/tmp/restart.txt
          cat Administrativo/dashboard/tmp/restart.txt

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 72.60.153.200
          username: u432659370.ojoaomendonca.com.br
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: Administrativo/dashboard/
          server-dir: nodejs/
          exclude: |
            **/.git*
            node_modules/**
            data/**
            .env
            .env.example
            .vercel/**
            vercel.json
            package-lock.json
            iniciar.bat
            public/estrategias/**/*.pdf
