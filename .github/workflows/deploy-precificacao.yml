name: Deploy Precificação → Hostinger

on:
  push:
    branches: [main]
    paths:
      - "operacoes/precificacao/**"
      - ".github/workflows/deploy-precificacao.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          local-dir: operacoes/precificacao/
          server-dir: public_html/precificacao/
          exclude: |
            **/.git*
            **/dashboard.html
