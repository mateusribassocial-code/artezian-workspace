<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Artezian — Tarefas</title>
<style>
:root {
  --bg:       #0f1117;
  --surface:  #1a1d27;
  --surface2: #21253a;
  --border:   #2e3248;
  --text:     #e8eaf0;
  --muted:    #8891a8;
  --radius:   10px;
  --locacao:  #4fc3f7;
  --venda:    #4caf85;
  --info:     #ce93d8;
  --done:     #4caf85;
  --doing:    #4fc3f7;
  --blocked:  #e05c5c;
}

*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;font-size:14px;min-height:100vh}

/* ── Header ── */
header{
  background:var(--surface);border-bottom:1px solid var(--border);
  padding:14px 24px;display:flex;align-items:center;justify-content:space-between;
  position:sticky;top:0;z-index:10;
}
.logo{font-size:16px;font-weight:700;letter-spacing:.5px}
.logo span{color:var(--locacao)}
.header-right{display:flex;align-items:center;gap:12px}
.data-hoje{color:var(--muted);font-size:12px}
.sync-status{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:5px}
.sync-dot{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync-dot.online{background:var(--done)}
.btn-nova{
  background:var(--locacao);color:#0f1117;border:none;
  padding:7px 16px;border-radius:7px;font-weight:600;font-size:13px;
  cursor:pointer;transition:opacity .15s;
}
.btn-nova:hover{opacity:.85}

/* ── Tabs ── */
.view-tabs{
  display:flex;align-items:center;gap:2px;
  padding:16px 24px 0;max-width:1400px;margin:0 auto;
}
.view-tab{
  background:none;border:none;color:var(--muted);font-size:13px;font-weight:500;
  padding:8px 18px;border-radius:8px 8px 0 0;cursor:pointer;
  border-bottom:2px solid transparent;transition:color .15s,border-color .15s,background .15s;
}
.view-tab.ativa{color:var(--text);border-bottom-color:var(--locacao);background:var(--surface)}
.view-tab:hover:not(.ativa){color:var(--text)}
.tab-count{
  display:inline-block;background:var(--surface2);color:var(--muted);
  font-size:10px;padding:1px 6px;border-radius:10px;margin-left:5px;
}
.view-tab.ativa .tab-count{background:var(--border)}

/* ── Board kanban ── */
.board{
  display:grid;grid-template-columns:repeat(3,1fr);gap:20px;
  padding:20px 24px 60px;max-width:1400px;margin:0 auto;align-items:start;
}

/* ── Coluna ── */
.coluna{display:flex;flex-direction:column;gap:10px}
.coluna-header{
  display:flex;align-items:center;gap:8px;padding-bottom:6px;
  border-bottom:2px solid var(--border);
}
.coluna-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.coluna-titulo{font-weight:600;font-size:14px}
.coluna-count{
  margin-left:auto;background:var(--surface2);color:var(--muted);
  font-size:11px;padding:2px 8px;border-radius:20px;
}

/* ── Card ── */
.card{
  background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);overflow:hidden;transition:border-color .2s;
}
.card.concluida{border-left:3px solid var(--done)}
.card.concluida .card-titulo{color:var(--muted);text-decoration:line-through}

.card-top{
  padding:12px 14px;display:flex;align-items:flex-start;
  justify-content:space-between;gap:8px;cursor:pointer;
}
.card-top:hover{background:var(--surface2)}
.card-titulo{font-weight:600;font-size:13px;line-height:1.4;flex:1;transition:color .2s}
.card-toggle{color:var(--muted);font-size:11px;flex-shrink:0;margin-top:2px;transition:transform .2s}
.card.open .card-toggle{transform:rotate(180deg)}

/* botões de ação no card */
.card-actions{display:flex;gap:3px;opacity:0;transition:opacity .15s;flex-shrink:0;align-items:center}
.card-top:hover .card-actions{opacity:1}
.btn-card{
  background:none;border:none;cursor:pointer;padding:3px 7px;
  border-radius:6px;font-size:11px;font-weight:600;transition:background .15s,color .15s;
  line-height:1.4;white-space:nowrap;
}
.btn-concluir{color:var(--done)}
.btn-concluir:hover{background:rgba(76,175,133,.15)}
.card.concluida .btn-concluir{color:var(--muted)}
.card.concluida .btn-concluir:hover{color:var(--text);background:var(--surface2)}
.btn-arquivar-card{color:var(--muted)}
.btn-arquivar-card:hover{color:var(--text);background:var(--surface2)}

.card-meta{
  padding:0 14px 10px;display:flex;flex-wrap:wrap;gap:6px;
  border-bottom:1px solid var(--border);
}
.badge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500}
.badge-setor-locacao{background:rgba(79,195,247,.15);color:var(--locacao)}
.badge-setor-venda  {background:rgba(76,175,133,.15);color:var(--venda)}
.badge-setor-info   {background:rgba(206,147,216,.15);color:var(--info)}
.badge-prazo{background:var(--surface2);color:var(--muted)}
.badge-prazo.vence-hoje{background:rgba(245,197,24,.12);color:#f5c518}
.badge-prazo.vencido   {background:rgba(224,92,92,.12);color:var(--blocked)}
.badge-envolvido{background:var(--surface2);color:var(--text);font-size:11px;padding:2px 8px;border-radius:20px}
.badge-tag{font-size:11px;padding:2px 9px;border-radius:20px;font-weight:600;border:1px solid transparent}

/* ── Linhas ── */
.card-body{display:none;flex-direction:column}
.card.open .card-body{display:flex}

.linha{
  display:flex;align-items:center;gap:10px;
  padding:8px 14px;border-bottom:1px solid var(--border);cursor:pointer;
}
.linha:last-child{border-bottom:none}
.linha:hover{background:var(--surface2)}

.linha-status{
  width:14px;height:14px;border-radius:4px;flex-shrink:0;
  border:2px solid var(--border);transition:background .15s,border-color .15s;
}
.linha[data-status="done"]    .linha-status{background:var(--done);border-color:var(--done)}
.linha[data-status="doing"]   .linha-status{background:var(--doing);border-color:var(--doing)}
.linha[data-status="blocked"] .linha-status{background:var(--blocked);border-color:var(--blocked)}

.linha-texto{
  flex:1;font-size:13px;line-height:1.4;
  outline:none;background:transparent;border:none;color:var(--text);cursor:pointer;
}
.linha-texto:focus{cursor:text}
.linha[data-status="done"] .linha-texto{text-decoration:line-through;color:var(--muted)}

.linha-del{
  opacity:0;color:var(--muted);background:none;border:none;
  cursor:pointer;font-size:14px;padding:2px;
}
.linha:hover .linha-del{opacity:1}

.add-linha{
  display:flex;align-items:center;gap:8px;padding:8px 14px;
  color:var(--muted);cursor:pointer;font-size:12px;
  border-top:1px dashed var(--border);background:none;
  border-left:none;border-right:none;border-bottom:none;
  width:100%;text-align:left;transition:color .15s;
}
.add-linha:hover{color:var(--text)}

/* ── Vazio ── */
.vazio{
  border:1px dashed var(--border);border-radius:var(--radius);
  padding:24px;text-align:center;color:var(--muted);font-size:12px;
}

/* ── Vista Arquivadas (lista) ── */
#view-arquivadas{display:none;padding:20px 24px 60px;max-width:1400px;margin:0 auto}
#view-arquivadas.visivel{display:block}

.arq-lista{display:flex;flex-direction:column;gap:1px}

.arq-header-row{
  display:grid;grid-template-columns:1fr 110px 1fr 90px 100px;
  gap:16px;padding:8px 16px;
  font-size:11px;font-weight:600;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;
  border-bottom:1px solid var(--border);margin-bottom:4px;
}

.arq-row{
  display:grid;grid-template-columns:1fr 110px 1fr 90px 100px;
  gap:16px;align-items:center;padding:12px 16px;
  background:var(--surface);border-radius:8px;
  transition:background .1s;
}
.arq-row:hover{background:var(--surface2)}

.arq-titulo{font-weight:500;font-size:13px}
.arq-setor{font-size:12px}
.arq-tags{display:flex;flex-wrap:wrap;gap:4px}
.arq-prazo{font-size:12px;color:var(--muted)}
.arq-acoes{display:flex;gap:6px;justify-content:flex-end}

.btn-reativar{
  background:rgba(79,195,247,.1);color:var(--locacao);border:1px solid rgba(79,195,247,.3);
  padding:4px 10px;border-radius:6px;font-size:11px;font-weight:600;
  cursor:pointer;transition:background .15s;white-space:nowrap;
}
.btn-reativar:hover{background:rgba(79,195,247,.2)}

.arq-vazio{
  text-align:center;padding:48px;color:var(--muted);font-size:13px;
}

/* ── Modal ── */
.overlay{
  display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:100;align-items:center;justify-content:center;padding:20px;
}
.overlay.open{display:flex}
.modal{
  background:var(--surface);border:1px solid var(--border);border-radius:12px;
  width:100%;max-width:540px;padding:24px;display:flex;flex-direction:column;gap:18px;
  max-height:90vh;overflow-y:auto;
}
.modal-header{display:flex;justify-content:space-between;align-items:center}
.modal-titulo{font-size:16px;font-weight:700}
.modal-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer}
.modal-close:hover{color:var(--text)}

.campo{display:flex;flex-direction:column;gap:6px}
.campo label{font-size:12px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.5px}
.campo input,.campo select{
  background:var(--surface2);border:1px solid var(--border);border-radius:7px;
  color:var(--text);padding:9px 12px;font-size:13px;outline:none;width:100%;
  transition:border-color .15s;
}
.campo input:focus,.campo select:focus{border-color:var(--locacao)}
.campo select option{background:var(--surface2)}

.chips-wrap{
  display:flex;flex-wrap:wrap;gap:6px;align-items:center;
  background:var(--surface2);border:1px solid var(--border);border-radius:7px;
  padding:6px 10px;min-height:40px;cursor:text;
}
.chips-wrap:focus-within{border-color:var(--locacao)}
.chip{
  background:var(--border);color:var(--text);border-radius:20px;
  padding:2px 10px;font-size:12px;display:flex;align-items:center;gap:5px;
}
.chip-del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:13px;line-height:1;padding:0}
.chip-del:hover{color:var(--text)}
.chips-input{background:none;border:none;outline:none;color:var(--text);font-size:13px;min-width:80px;flex:1}

.tags-picker{display:flex;flex-direction:column;gap:8px}
.tags-lista{display:flex;flex-wrap:wrap;gap:6px}
.tag-opcao{
  font-size:12px;padding:4px 12px;border-radius:20px;font-weight:600;
  border:1px solid transparent;cursor:pointer;transition:opacity .15s,transform .1s;user-select:none;
}
.tag-opcao.selecionada{transform:scale(1.05)}
.tag-opcao:not(.selecionada){opacity:.4}

.tag-nova-wrap{display:flex;gap:8px;align-items:center}
.tag-nova-input{
  flex:1;background:var(--surface2);border:1px solid var(--border);border-radius:7px;
  color:var(--text);padding:7px 12px;font-size:12px;outline:none;transition:border-color .15s;
}
.tag-nova-input:focus{border-color:var(--locacao)}
.tag-nova-input::placeholder{color:var(--muted)}

.cor-picker{display:flex;gap:6px;align-items:center}
.cor-opcao{
  width:20px;height:20px;border-radius:50%;cursor:pointer;
  border:2px solid transparent;transition:border-color .15s,transform .1s;
}
.cor-opcao.ativa{border-color:var(--text);transform:scale(1.2)}

.btn-add-tag{
  background:var(--surface2);border:1px solid var(--border);color:var(--muted);
  padding:7px 12px;border-radius:7px;font-size:12px;cursor:pointer;
  transition:color .15s,border-color .15s;white-space:nowrap;
}
.btn-add-tag:hover{color:var(--text);border-color:var(--muted)}

.modal-footer{display:flex;justify-content:flex-end;gap:10px}
.btn-cancel{
  background:none;border:1px solid var(--border);color:var(--muted);
  padding:8px 18px;border-radius:7px;font-size:13px;cursor:pointer;
}
.btn-cancel:hover{color:var(--text);border-color:var(--muted)}
.btn-salvar{
  background:var(--locacao);color:#0f1117;border:none;
  padding:8px 18px;border-radius:7px;font-weight:600;font-size:13px;cursor:pointer;
}
.btn-salvar:hover{opacity:.85}
.btn-salvar:disabled{opacity:.5;cursor:not-allowed}

/* ── Legenda ── */
.legenda{
  display:flex;align-items:center;gap:16px;padding:8px 24px;
  font-size:11px;color:var(--muted);border-top:1px solid var(--border);
  position:fixed;bottom:0;left:0;right:0;background:var(--surface);
}
.leg-item{display:flex;align-items:center;gap:5px}
.leg-dot{width:10px;height:10px;border-radius:3px}

@media(max-width:900px){
  .board{grid-template-columns:1fr}
  .arq-header-row,.arq-row{grid-template-columns:1fr 80px 80px}
  .arq-tags,.arq-prazo{display:none}
}
</style>
</head>
<body>

<header>
  <div class="logo">Artezian <span>Real Estate</span></div>
  <div class="header-right">
    <div class="sync-status">
      <div class="sync-dot" id="syncDot"></div>
      <span id="syncLabel">conectando...</span>
    </div>
    <div class="data-hoje" id="dataHoje"></div>
    <button class="btn-nova" id="btn-nova" onclick="abrirModal()">+ Nova Tarefa</button>
  </div>
</header>

<!-- Tabs -->
<div class="view-tabs">
  <button class="view-tab ativa" id="tab-ativas" onclick="mudarView('ativas')">
    Ativas <span class="tab-count" id="tab-count-ativas">0</span>
  </button>
  <button class="view-tab" id="tab-arquivadas" onclick="mudarView('arquivadas')">
    Arquivadas <span class="tab-count" id="tab-count-arquivadas">0</span>
  </button>
</div>

<!-- Kanban (ativas) -->
<div class="board" id="board">
  <div class="coluna">
    <div class="coluna-header">
      <div class="coluna-dot" style="background:var(--locacao)"></div>
      <div class="coluna-titulo">Locação</div>
      <div class="coluna-count" id="count-locacao">0</div>
    </div>
    <div id="cards-locacao"></div>
  </div>
  <div class="coluna">
    <div class="coluna-header">
      <div class="coluna-dot" style="background:var(--venda)"></div>
      <div class="coluna-titulo">Venda</div>
      <div class="coluna-count" id="count-venda">0</div>
    </div>
    <div id="cards-venda"></div>
  </div>
  <div class="coluna">
    <div class="coluna-header">
      <div class="coluna-dot" style="background:var(--info)"></div>
      <div class="coluna-titulo">Infoproduto</div>
      <div class="coluna-count" id="count-info">0</div>
    </div>
    <div id="cards-info"></div>
  </div>
</div>

<!-- Vista arquivadas (lista) -->
<div id="view-arquivadas">
  <div class="arq-header-row">
    <div>Tarefa</div>
    <div>Setor</div>
    <div>Tags</div>
    <div>Prazo</div>
    <div></div>
  </div>
  <div class="arq-lista" id="arq-lista"></div>
</div>

<!-- Modal nova tarefa -->
<div class="overlay" id="overlay">
  <div class="modal">
    <div class="modal-header">
      <div class="modal-titulo">Nova Tarefa</div>
      <button class="modal-close" onclick="fecharModal()">✕</button>
    </div>
    <div class="campo">
      <label>Título</label>
      <input type="text" id="inp-titulo" placeholder="Ex: Criar proposta de investimento"/>
    </div>
    <div class="campo">
      <label>Setor</label>
      <select id="inp-setor">
        <option value="locacao">Locação</option>
        <option value="venda">Venda</option>
        <option value="info">Infoproduto</option>
      </select>
    </div>
    <div class="campo">
      <label>Tags</label>
      <div class="tags-picker">
        <div class="tags-lista" id="tags-lista"></div>
        <div class="tag-nova-wrap">
          <input class="tag-nova-input" id="tag-nova-input" placeholder="Nova tag..."/>
          <div class="cor-picker" id="cor-picker"></div>
          <button class="btn-add-tag" onclick="criarNovaTag()">+ Criar</button>
        </div>
      </div>
    </div>
    <div class="campo">
      <label>Envolvidos</label>
      <div class="chips-wrap" id="chips-wrap" onclick="document.getElementById('chips-input').focus()">
        <input class="chips-input" id="chips-input" placeholder="Digite e pressione Enter"/>
      </div>
    </div>
    <div class="campo">
      <label>Data de entrega</label>
      <input type="date" id="inp-prazo"/>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-salvar" id="btn-salvar" onclick="criarTarefa()">Criar Tarefa</button>
    </div>
  </div>
</div>

<div class="legenda">
  <div class="leg-item"><div class="leg-dot" style="background:var(--done)"></div> Concluído</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--doing)"></div> Em andamento</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--blocked)"></div> Travado</div>
  <div class="leg-item"><div class="leg-dot" style="background:var(--border)"></div> Pendente</div>
  <span style="margin-left:auto">Clique no status para alternar • Enter para nova linha</span>
</div>

<script type="module">
import { documentoSincronizado } from '../az-store.js';

/* Persistencia local. Antes isto vivia no Firestore; o painel passou a rodar
   so na maquina, entao os dados ficam no proprio navegador.

   Os atalhos abaixo imitam a interface do Firestore (doc/updateDoc/addDoc)
   de proposito: assim os pontos que criam e editam tarefas seguem escritos
   do mesmo jeito, e a troca ficou contida neste bloco. */

const store = documentoSincronizado({
  chaveLocal: 'artezian_tarefas_v1',
  aoMudarStatus: (estado) => setSync(estado),
});

let dados = { tarefas: [], tags: [] };

const novoId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

const db      = null;                  // mantido so para as chamadas doc(db, ...)
const colRef  = { nome: 'tarefas' };
const tagsRef = { nome: 'tags' };

const doc = (_db, nome, id) => ({ nome, id });
const serverTimestamp = () => Date.now();

function persistir() {
  store.salvar(dados);
  recarregarDoEstado();
}

async function updateDoc(ref, patch) {
  const lista = dados[ref.nome];
  const alvo  = lista.find(x => x.id === ref.id);
  if (alvo) Object.assign(alvo, patch);
  persistir();
}

async function addDoc(ref, obj) {
  const id = novoId();
  dados[ref.nome].push({ id, ...obj });
  persistir();
  return { id };
}

// ── Tags padrão ───────────────────────────────────────────────
const TAGS_DEFAULT = [
  { id: 'youtube',        nome: 'Youtube',       cor: '#ff4444' },
  { id: 'instagram',      nome: 'Instagram',      cor: '#e1306c' },
  { id: 'administrativo', nome: 'Administrativo', cor: '#ff9800' },
];
const CORES_PALETA = ['#4fc3f7','#4caf85','#ce93d8','#f5c518','#ff9800','#e05c5c','#80cbc4','#ffb74d'];

// ── Estado ────────────────────────────────────────────────────
let tarefas          = [];
let tagsCustom       = [];
let tagsSelecionadas = [];
let chipsEnvolvidos  = [];
let corSelecionada   = CORES_PALETA[0];
let viewAtual        = 'ativas';

const todasTags = () => [...TAGS_DEFAULT, ...tagsCustom];

// ── Carga ─────────────────────────────────────────────────────
function recarregarDoEstado() {
  tarefas    = [...dados.tarefas].sort((a, b) => (b.criadoEm || 0) - (a.criadoEm || 0));
  tagsCustom = [...dados.tags].sort((a, b) => (a.criadoEm || 0) - (b.criadoEm || 0));
  render();
  renderTagsPicker();
}

dados = await store.iniciar({ tarefas: [], tags: [] });
if (!Array.isArray(dados.tarefas)) dados.tarefas = [];
if (!Array.isArray(dados.tags))    dados.tags    = [];
recarregarDoEstado();

// ── Sync ──────────────────────────────────────────────────────
function setSync(estado) {
  const ok = estado !== 'erro';
  document.getElementById('syncDot').className = 'sync-dot' + (ok ? ' online' : '');
  document.getElementById('syncLabel').textContent =
    estado === 'salvando' ? 'salvando…' : ok ? 'salvo neste navegador' : 'não foi possível salvar';
}

// ── Render principal ──────────────────────────────────────────
function render() {
  const arq = viewAtual === 'arquivadas';

  // contadores das tabs
  document.getElementById('tab-count-ativas').textContent     = tarefas.filter(t => !t.arquivada).length;
  document.getElementById('tab-count-arquivadas').textContent = tarefas.filter(t =>  t.arquivada).length;

  if (arq) {
    document.getElementById('board').style.display          = 'none';
    document.getElementById('view-arquivadas').classList.add('visivel');
    renderListaArquivadas();
  } else {
    document.getElementById('board').style.display          = '';
    document.getElementById('view-arquivadas').classList.remove('visivel');
    renderKanban();
  }
}

function renderKanban() {
  const ativas = tarefas.filter(t => !t.arquivada);
  const cols   = { locacao: '', venda: '', info: '' };
  const counts = { locacao: 0, venda: 0, info: 0 };

  ativas.forEach(t => {
    if (cols[t.setor] === undefined) return;
    counts[t.setor]++;
    cols[t.setor] += buildCard(t);
  });

  ['locacao','venda','info'].forEach(s => {
    document.getElementById('cards-' + s).innerHTML =
      cols[s] || '<div class="vazio">Nenhuma tarefa</div>';
    document.getElementById('count-' + s).textContent = counts[s] || 0;
  });
}

function renderListaArquivadas() {
  const lista = document.getElementById('arq-lista');
  const arqs  = tarefas.filter(t => t.arquivada);

  if (!arqs.length) {
    lista.innerHTML = '<div class="arq-vazio">Nenhuma tarefa arquivada</div>';
    return;
  }

  lista.innerHTML = arqs.map(t => {
    const prazo    = formatPrazo(t.prazo);
    const pClass   = prazoClass(t.prazo);
    const tagBadges= (t.tags || []).map(id => {
      const tag = todasTags().find(x => x.id === id);
      if (!tag) return '';
      return `<span class="badge-tag" style="background:${tag.cor}22;color:${tag.cor};border-color:${tag.cor}44">${esc(tag.nome)}</span>`;
    }).join('');

    return `
    <div class="arq-row">
      <div class="arq-titulo">${esc(t.titulo)}</div>
      <div class="arq-setor"><span class="badge badge-setor-${t.setor}">${setorLabel(t.setor)}</span></div>
      <div class="arq-tags">${tagBadges || '<span style="color:var(--muted);font-size:12px">—</span>'}</div>
      <div class="arq-prazo ${pClass}">${prazo || '—'}</div>
      <div class="arq-acoes">
        <button class="btn-reativar" onclick="arquivarTarefa('${t.id}',false)">↩ Reativar</button>
      </div>
    </div>`;
  }).join('');
}

// ── Build card kanban ─────────────────────────────────────────
function buildCard(t) {
  const prazoLabel = formatPrazo(t.prazo);
  const pClass     = prazoClass(t.prazo);
  const concluida  = t.concluida ? 'concluida' : '';

  const tagBadges = (t.tags || []).map(id => {
    const tag = todasTags().find(x => x.id === id);
    if (!tag) return '';
    return `<span class="badge-tag" style="background:${tag.cor}22;color:${tag.cor};border-color:${tag.cor}44">${esc(tag.nome)}</span>`;
  }).join('');

  const envolvidos = (t.envolvidos || []).map(e =>
    `<span class="badge badge-envolvido">${esc(e)}</span>`).join('');

  const linhas = (t.linhas || []).map((l, i) => `
    <div class="linha" data-status="${l.status}" data-id="${t.id}" data-idx="${i}" onclick="ciclarStatus(this)">
      <div class="linha-status"></div>
      <div class="linha-texto" contenteditable="true"
           onblur="salvarTextoLinha('${t.id}',${i},this)"
           onclick="event.stopPropagation()"
           onkeydown="linhaKeydown(event,'${t.id}',${i})"
      >${esc(l.texto)}</div>
      <button class="linha-del" onclick="event.stopPropagation();deletarLinha('${t.id}',${i})">✕</button>
    </div>`).join('');

  const labelConcluir = t.concluida ? '↩ Reabrir' : '✓ Concluir';

  return `
  <div class="card ${concluida} ${t.open ? 'open' : ''}" id="card-${t.id}">
    <div class="card-top" onclick="toggleCard('${t.id}')">
      <div class="card-titulo">${esc(t.titulo)}</div>
      <div class="card-actions">
        <button class="btn-card btn-concluir"
                onclick="event.stopPropagation();concluirTarefa('${t.id}',${!t.concluida})"
        >${labelConcluir}</button>
        <button class="btn-card btn-arquivar-card" title="Arquivar"
                onclick="event.stopPropagation();arquivarTarefa('${t.id}',true)"
        >📦</button>
      </div>
      <div class="card-toggle">▾</div>
    </div>
    <div class="card-meta">
      <span class="badge badge-setor-${t.setor}">${setorLabel(t.setor)}</span>
      ${tagBadges}
      ${prazoLabel ? `<span class="badge badge-prazo ${pClass}">📅 ${prazoLabel}</span>` : ''}
      ${envolvidos}
    </div>
    <div class="card-body">
      ${linhas}
      <button class="add-linha" onclick="adicionarLinha('${t.id}')">+ Adicionar linha</button>
    </div>
  </div>`;
}

// ── Helpers ───────────────────────────────────────────────────
function esc(s = '') {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;')
    .replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function setorLabel(s) { return { locacao:'Locação', venda:'Venda', info:'Infoproduto' }[s] || s; }
function formatPrazo(p) {
  if (!p) return '';
  return new Date(p + 'T00:00:00').toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit' });
}
function prazoClass(p) {
  if (!p) return '';
  const hoje = new Date(); hoje.setHours(0,0,0,0);
  const d = new Date(p + 'T00:00:00');
  if (d < hoje) return 'vencido';
  if (d.getTime() === hoje.getTime()) return 'vence-hoje';
  return '';
}

// ── Ações ─────────────────────────────────────────────────────
window.mudarView = (view) => {
  viewAtual = view;
  document.getElementById('tab-ativas').className     = 'view-tab' + (view === 'ativas'     ? ' ativa' : '');
  document.getElementById('tab-arquivadas').className = 'view-tab' + (view === 'arquivadas' ? ' ativa' : '');
  document.getElementById('btn-nova').style.display   = view === 'ativas' ? '' : 'none';
  render();
};

window.concluirTarefa = async (id, concluir) => {
  await updateDoc(doc(db, 'tarefas', id), { concluida: concluir });
};

window.arquivarTarefa = async (id, arquivar) => {
  await updateDoc(doc(db, 'tarefas', id), { arquivada: arquivar });
};

window.toggleCard = async (id) => {
  const t = tarefas.find(x => x.id === id);
  if (!t) return;
  await updateDoc(doc(db, 'tarefas', id), { open: !t.open });
};

const CICLO = ['pending','doing','done','blocked'];

window.ciclarStatus = async (el) => {
  const id  = el.dataset.id;
  const idx = parseInt(el.dataset.idx);
  const t   = tarefas.find(x => x.id === id);
  if (!t) return;
  const linhas = [...(t.linhas || [])];
  const cur    = linhas[idx].status;
  linhas[idx]  = { ...linhas[idx], status: CICLO[(CICLO.indexOf(cur) + 1) % CICLO.length] };
  el.dataset.status = linhas[idx].status;
  el.querySelector('.linha-texto').style.textDecoration =
    linhas[idx].status === 'done' ? 'line-through' : '';
  await updateDoc(doc(db, 'tarefas', id), { linhas });
};

window.salvarTextoLinha = async (id, idx, el) => {
  const t = tarefas.find(x => x.id === id);
  if (!t) return;
  const linhas = [...(t.linhas || [])];
  linhas[idx] = { ...linhas[idx], texto: el.textContent.trim() };
  await updateDoc(doc(db, 'tarefas', id), { linhas });
};

window.linhaKeydown = (e, id, idx) => {
  if (e.key === 'Enter') { e.preventDefault(); adicionarLinha(id, idx); }
};

window.adicionarLinha = async (id, afterIdx) => {
  const t = tarefas.find(x => x.id === id);
  if (!t) return;
  const linhas = [...(t.linhas || [])];
  const nova   = { texto: '', status: 'pending' };
  if (afterIdx !== undefined) linhas.splice(afterIdx + 1, 0, nova);
  else linhas.push(nova);
  await updateDoc(doc(db, 'tarefas', id), { linhas, open: true });
  setTimeout(() => {
    const card   = document.getElementById('card-' + id);
    const items  = card.querySelectorAll('.linha-texto');
    const target = afterIdx !== undefined ? items[afterIdx + 1] : items[items.length - 1];
    if (target) target.focus();
  }, 300);
};

window.deletarLinha = async (id, idx) => {
  const t = tarefas.find(x => x.id === id);
  if (!t) return;
  const linhas = [...(t.linhas || [])];
  linhas.splice(idx, 1);
  await updateDoc(doc(db, 'tarefas', id), { linhas });
};

// ── Modal ─────────────────────────────────────────────────────
window.abrirModal = () => {
  chipsEnvolvidos  = [];
  tagsSelecionadas = [];
  corSelecionada   = CORES_PALETA[0];
  renderChips();
  renderTagsPicker();
  document.getElementById('inp-titulo').value = '';
  document.getElementById('inp-prazo').value  = '';
  document.getElementById('overlay').classList.add('open');
  setTimeout(() => document.getElementById('inp-titulo').focus(), 100);
};

window.fecharModal = () => {
  document.getElementById('overlay').classList.remove('open');
};

document.getElementById('overlay').addEventListener('click', e => {
  if (e.target === document.getElementById('overlay')) fecharModal();
});

document.getElementById('chips-input').addEventListener('keydown', e => {
  const v = e.target.value.trim();
  if ((e.key === 'Enter' || e.key === ',') && v) {
    e.preventDefault();
    chipsEnvolvidos.push(v);
    e.target.value = '';
    renderChips();
  } else if (e.key === 'Backspace' && !v && chipsEnvolvidos.length) {
    chipsEnvolvidos.pop();
    renderChips();
  }
});

document.getElementById('tag-nova-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { e.preventDefault(); criarNovaTag(); }
});

function renderChips() {
  const wrap  = document.getElementById('chips-wrap');
  const input = document.getElementById('chips-input');
  wrap.querySelectorAll('.chip').forEach(c => c.remove());
  chipsEnvolvidos.forEach((nome, i) => {
    const chip = document.createElement('span');
    chip.className = 'chip';
    chip.innerHTML = `${esc(nome)} <button class="chip-del" onclick="removerChip(${i})">✕</button>`;
    wrap.insertBefore(chip, input);
  });
}

window.removerChip = (i) => { chipsEnvolvidos.splice(i, 1); renderChips(); };

function renderTagsPicker() {
  const lista = document.getElementById('tags-lista');
  if (!lista) return;
  lista.innerHTML = todasTags().map(tag => `
    <div class="tag-opcao ${tagsSelecionadas.includes(tag.id) ? 'selecionada' : ''}"
         style="background:${tag.cor}22;color:${tag.cor};border-color:${tag.cor}55"
         onclick="toggleTag('${tag.id}')">${esc(tag.nome)}</div>
  `).join('');

  document.getElementById('cor-picker').innerHTML = CORES_PALETA.map(cor => `
    <div class="cor-opcao ${cor === corSelecionada ? 'ativa' : ''}"
         style="background:${cor}" onclick="selecionarCor('${cor}')"></div>
  `).join('');
}

window.toggleTag = (id) => {
  const idx = tagsSelecionadas.indexOf(id);
  if (idx >= 0) tagsSelecionadas.splice(idx, 1);
  else tagsSelecionadas.push(id);
  renderTagsPicker();
};

window.selecionarCor = (cor) => { corSelecionada = cor; renderTagsPicker(); };

window.criarNovaTag = async () => {
  const nome = document.getElementById('tag-nova-input').value.trim();
  if (!nome) return;
  const docRef = await addDoc(tagsRef, { nome, cor: corSelecionada, criadoEm: serverTimestamp() });
  tagsSelecionadas.push(docRef.id);
  document.getElementById('tag-nova-input').value = '';
  corSelecionada = CORES_PALETA[0];
};

window.criarTarefa = async () => {
  const titulo = document.getElementById('inp-titulo').value.trim();
  if (!titulo) { document.getElementById('inp-titulo').focus(); return; }
  const btn = document.getElementById('btn-salvar');
  btn.disabled = true; btn.textContent = 'Salvando...';
  await addDoc(colRef, {
    titulo,
    setor:      document.getElementById('inp-setor').value,
    tags:       [...tagsSelecionadas],
    envolvidos: [...chipsEnvolvidos],
    prazo:      document.getElementById('inp-prazo').value,
    linhas:     [],
    open:       false,
    concluida:  false,
    arquivada:  false,
    criadoEm:  serverTimestamp(),
  });
  btn.disabled = false; btn.textContent = 'Criar Tarefa';
  fecharModal();
};

document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

document.getElementById('dataHoje').textContent =
  new Date().toLocaleDateString('pt-BR', { weekday:'long', day:'numeric', month:'long' });
</script>
